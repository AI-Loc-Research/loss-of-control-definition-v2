[project]
name = "loss-of-control-definition"
version = "0.1.0"
description = "Pipeline for extracting and synthesising definitions of 'loss of control' from AI safety literature"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24.0",
    "huggingface-hub>=0.25.0",
    "requests>=2.31.0,<2.33.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0,<3.0.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "openpyxl>=3.1.5",
    "anthropic>=1.13.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
